[tool.poetry]
name = "breakdown"
version = "0.1.0"
description = "BREAKDOWN: bond rearrangement, events and kinetics from MD trajectories"
authors = ["TheodorePellegrin <pellegrintheodore@gmail.com>"]
readme = "README.md"
packages = [{ include = "breakdown", from = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
click = "^8.1.7"
numpy = "^1.26.2"
pandas = "^2.1.3"
matplotlib = "^3.8.2"
rdkit = "^2023.9.2"
openpyxl = "^3.1.2"
networkx = "^3.2.1"
graphviz = "^0.20.1"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
breakdown = "breakdown.main:main_group"